name: Constitutional review tests

on:
  pull_request:
    paths:
      - ".github/workflows/constitutional-review-clerk.yml"
      - ".github/workflows/cei-evidence-review-clerk.yml"
      - "tests/test_erdos_cohort_closure_review_clerk.py"
      - "scripts/erdos_cohort_closure_review_clerk.py"
      - "governance/credentials/GCL-ERDOS-CLOSURE-REVIEW-CLERK-001.json"
      - ".github/workflows/erdos-cohort-closure-review-clerk.yml"
      - "governance/credentials/GCL-CEI-EVIDENCE-REVIEW-CLERK-001.json"
      - "scripts/cei_evidence_review_clerk.py"
      - "tests/test_cei_evidence_review_clerk.py"
      - ".github/workflows/constitutional-review-tests.yml"
      - "governance/review-campaigns/**"
      - "scripts/constitutional_review_clerk.py"
      - "tests/test_constitutional_review_clerk.py"
      - "tests/test_phase2_clerk_acceptance.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/constitutional-review-clerk.yml"
      - ".github/workflows/cei-evidence-review-clerk.yml"
      - "governance/credentials/GCL-CEI-EVIDENCE-REVIEW-CLERK-001.json"
      - "scripts/cei_evidence_review_clerk.py"
      - "tests/test_cei_evidence_review_clerk.py"
      - ".github/workflows/constitutional-review-tests.yml"
      - "governance/review-campaigns/**"
      - "scripts/constitutional_review_clerk.py"
      - "tests/test_constitutional_review_clerk.py"
      - "tests/test_phase2_clerk_acceptance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
