name: Constitutional review tests

on:
  pull_request:
    paths:
      - ".github/workflows/constitutional-review-clerk.yml"
      - ".github/workflows/constitutional-review-tests.yml"
      - "governance/review-campaigns/**"
      - "scripts/constitutional_review_clerk.py"
      - "tests/test_constitutional_review_clerk.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/constitutional-review-clerk.yml"
      - ".github/workflows/constitutional-review-tests.yml"
      - "governance/review-campaigns/**"
      - "scripts/constitutional_review_clerk.py"
      - "tests/test_constitutional_review_clerk.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate canonical successor packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/constitutional_review_clerk.py \
            --config governance/review-campaigns/GI-AMEND-0001.json \
            --output-dir /tmp/gi-amend-0001-packet
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('/tmp/gi-amend-0001-packet/review-packet.json').read_text())
          print('SUBJECT_SHA256=' + packet['subject_sha256'])
          print('PACKET_SHA256=' + packet['packet_sha256'])
          print(json.dumps(packet, indent=2, sort_keys=True))
          PY
