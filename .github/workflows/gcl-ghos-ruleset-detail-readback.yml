name: GCL-GHOS ruleset detail readback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gcl-ghos-ruleset-detail-readback.yml"

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint organization readback token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Collect full repository rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p readback-output
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          owner = "grandchallenge"
          repos = [".github","INTELLECT","gcl-standards","MATH-PROGRAMME","MATHFORGE","MATHSOLVE","MATHCERT","MODULUS","GLOSS","QUANTUM-TECHNOLOGIES","lean-action","upload-pages-artifact"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          def get(path):
              req = urllib.request.Request(api + path, headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"gcl-ghos-ruleset-detail-readback",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                      return r.status, json.loads(data) if data else None
              except urllib.error.HTTPError as e:
                  data = e.read()
                  try: payload = json.loads(data) if data else None
                  except json.JSONDecodeError: payload = data.decode(errors="replace")
                  return e.code, payload

          out = {
              "schema_version":"1.0.0",
              "campaign_id":"GCL-GHOS-SETTINGS-READBACK-001",
              "recorded_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),
              "repositories":{},
          }
          for repo in repos:
              status, listed = get(f"/repos/{owner}/{repo}/rulesets?per_page=100")
              row = {"list_status":status,"rulesets":[]}
              if status == 200 and isinstance(listed, list):
                  for item in listed:
                      rule_id = item.get("id")
                      detail_status, detail = get(f"/repos/{owner}/{repo}/rulesets/{rule_id}")
                      row["rulesets"].append({"id":rule_id,"detail_status":detail_status,"detail":detail})
              else:
                  row["list_payload"] = listed
              out["repositories"][repo] = row
          Path("readback-output/GCL-GHOS-RULESET-DETAILS-001.json").write_text(json.dumps(out, indent=2, sort_keys=True)+"\n")
          print(json.dumps({repo:{"list_status":row["list_status"],"detail_statuses":[x["detail_status"] for x in row["rulesets"]]} for repo,row in out["repositories"].items()}, indent=2, sort_keys=True))
          PY
      - name: Preserve full ruleset readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl-ghos-ruleset-details-001
          path: readback-output/GCL-GHOS-RULESET-DETAILS-001.json
          if-no-files-found: error
          retention-days: 14
