name: GI-AMEND packet probe

on:
  pull_request:
    paths:
      - ".github/workflows/gi-amend-packet-probe.yml"
      - "governance/review-campaigns/GI-AMEND-0001.json"
      - "scripts/constitutional_review_clerk.py"

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  packet-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate canonical packet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/constitutional_review_clerk.py \
            --config governance/review-campaigns/GI-AMEND-0001.json \
            --output-dir /tmp/gi-amend-packet
          cat /tmp/gi-amend-packet/review-packet.json
          cat /tmp/gi-amend-packet/review-status.json
