name: GCL security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  action-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject mutable action references
        shell: bash
        run: |
          if grep -RhE \
            '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+' \
            .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "Every external Action must use a full commit SHA."
            exit 1
          fi
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard result
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          sarif_file: results.sarif
