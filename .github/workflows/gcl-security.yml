name: GCL security

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  action-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject mutable action references
        shell: bash
        run: |
          if grep -RhoE 'uses: [^[:space:]]+@[^[:space:]]+' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)'; then
            echo "Every external Action must use a full commit SHA."
            exit 1
          fi
      - uses: ossf/scorecard-action@f2ea147fec3c2f0d459703eba7405b5e9bcd8c8f
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
        with:
          sarif_file: results.sarif
