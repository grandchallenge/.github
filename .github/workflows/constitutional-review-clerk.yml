name: Constitutional review clerk

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Review campaign identifier
        required: true
        default: GI-AMEND-0001
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: constitutional-review-clerk-${{ inputs.campaign || 'scheduled' }}
  cancel-in-progress: false

jobs:
  review-clerk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Mint Council Clerk token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Select review campaign
        id: campaign
        shell: bash
        env:
          REQUESTED_CAMPAIGN: ${{ inputs.campaign }}
        run: |
          campaign="${REQUESTED_CAMPAIGN:-GI-AMEND-0001}"
          [[ "$campaign" =~ ^[A-Za-z0-9._-]+$ ]] ||
            { echo "invalid campaign identifier"; exit 1; }
          config="governance/review-campaigns/${campaign}.json"
          test -f "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "output=review-evidence/$campaign" >> "$GITHUB_OUTPUT"
      - name: Run constitutional review clerk
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/constitutional_review_clerk.py \
            --config "${{ steps.campaign.outputs.config }}" \
            --output-dir "${{ steps.campaign.outputs.output }}" \
            --apply
      - name: Preserve review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: constitutional-review-${{ inputs.campaign || 'GI-AMEND-0001' }}
          path: ${{ steps.campaign.outputs.output }}
          if-no-files-found: error
          retention-days: 90
