name: GI-AMEND-0001 successor packet probe

on:
  pull_request:
    paths:
      - '.github/workflows/gi-amend-0001-successor-packet-probe.yml'

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  packet-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate canonical successor packet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/constitutional_review_clerk.py \
            --config governance/review-campaigns/GI-AMEND-0001.json \
            --output-dir /tmp/gi-amend-0001-packet
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('/tmp/gi-amend-0001-packet/review-packet.json').read_text())
          print('SUBJECT_SHA256=' + packet['subject_sha256'])
          print('PACKET_SHA256=' + packet['packet_sha256'])
          print(json.dumps(packet, indent=2, sort_keys=True))
          PY
