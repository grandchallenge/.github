name: GI-AMEND-0001 final packet publication

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/gi-amend-0001-final-packet-publish.yml"

permissions:
  contents: read

jobs:
  publish-final-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mint Council Clerk token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Publish final packet and Human Steward attestation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/constitutional_review_clerk.py \
            --config governance/review-campaigns/GI-AMEND-0001.json \
            --output-dir review-evidence/GI-AMEND-0001 \
            --apply
          cat review-evidence/GI-AMEND-0001/review-status.json
      - name: Preserve publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gi-amend-0001-final-packet-publication
          path: review-evidence/GI-AMEND-0001
          if-no-files-found: error
          retention-days: 14
