name: GCL release

on:
  workflow_call:
    inputs:
      release_kind:
        required: true
        type: string
      artifact_manifest:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-evidence:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate manifest
        shell: bash
        env:
          MANIFEST: ${{ inputs.artifact_manifest }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          test -f "$MANIFEST"
          sha256sum "$MANIFEST" > release-manifest.sha256
          printf 'release_kind=%s\nsource=%s\n' "$RELEASE_KIND" "$GITHUB_SHA" \
            > release-evidence.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ inputs.artifact_manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: |
            release-manifest.sha256
            release-evidence.txt
