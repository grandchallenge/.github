name: GCL-GHOS owner export tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/gcl_ghos_owner_export.py"
      - "tests/test_gcl_ghos_owner_export.py"
      - "governance/settings-readback/GCL-GHOS-OWNER-EXPORT-001.schema.json"
      - "docs/GCL-GHOS-OWNER-EXPORT-001.md"
      - ".github/workflows/gcl-ghos-owner-export-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/gcl_ghos_owner_export.py"
      - "tests/test_gcl_ghos_owner_export.py"
      - "governance/settings-readback/GCL-GHOS-OWNER-EXPORT-001.schema.json"
      - "docs/GCL-GHOS-OWNER-EXPORT-001.md"
      - ".github/workflows/gcl-ghos-owner-export-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"
      - name: Run owner-export tests
        run: python -m unittest tests/test_gcl_ghos_owner_export.py
