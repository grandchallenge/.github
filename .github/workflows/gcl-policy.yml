name: GCL policy

on:
  workflow_call:
    inputs:
      profile:
        description: Constitutional repository profile
        required: true
        type: string
      standards_ref:
        description: Exact gcl-standards commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject mutable standards identity
        shell: bash
        env:
          STANDARDS_REF: ${{ inputs.standards_ref }}
        run: |
          [[ "$STANDARDS_REF" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "standards_ref must be a full commit SHA"; exit 1; }
      - name: Check out externally governed routing gate
        if: inputs.profile == 'Standards'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grandchallenge/.github
          ref: ef1cce6029233a68cf46063cea2384772fcae613
          path: .gcl-policy-runtime
          persist-credentials: false
      - name: Install routing gate dependency
        if: inputs.profile == 'Standards'
        run: python -m pip install PyYAML==6.0.3
      - name: Enforce mandatory execution routing externally
        if: inputs.profile == 'Standards'
        shell: bash
        run: |
          echo "fc0a9a4d20de72e9fbc04c8cd54cffc3a6e4657fb09e7978b360616bd5e94a17  .gcl-policy-runtime/scripts/ghos_execution_routing_gate.py" | sha256sum --check --strict
          python .gcl-policy-runtime/scripts/ghos_execution_routing_gate.py \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY"
      - name: Validate constitutional files
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          test -f SECURITY.md
          test -f SUPPORT.md
          test -f AGENTS.md
          test -f .github/CODEOWNERS
          printf '{"profile":"%s","repository":"%s","commit":"%s","run_id":"%s"}\n' \
            "$PROFILE" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > gcl-evidence-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gcl-policy-evidence
          path: gcl-evidence-manifest.json
          if-no-files-found: error
