name: GCL-GHOS repository surface readback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gcl-ghos-repository-surface-readback.yml"

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint organization readback token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Collect repository governance surfaces
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p readback-output
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          owner = "grandchallenge"
          repos = [".github","INTELLECT","gcl-standards","MATH-PROGRAMME","MATHFORGE","MATHSOLVE","MATHCERT","MODULUS","GLOSS","QUANTUM-TECHNOLOGIES","lean-action","upload-pages-artifact"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          def get(path):
              req = urllib.request.Request(api + path, headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"gcl-ghos-repository-surface-readback",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read(); return r.status, json.loads(data) if data else None
              except urllib.error.HTTPError as e:
                  data=e.read()
                  try: payload=json.loads(data) if data else None
                  except json.JSONDecodeError: payload=data.decode(errors="replace")
                  return e.code,payload

          def contents(repo,path):
              quoted=urllib.parse.quote(path, safe="/")
              status,payload=get(f"/repos/{owner}/{repo}/contents/{quoted}?ref=main")
              result={"status":status,"path":path}
              if status==200 and isinstance(payload,list):
                  result["entries"]=[{"name":x.get("name"),"path":x.get("path"),"type":x.get("type"),"sha":x.get("sha")} for x in payload]
              elif status==200 and isinstance(payload,dict):
                  result["entry"]={"name":payload.get("name"),"path":payload.get("path"),"type":payload.get("type"),"sha":payload.get("sha")}
              else:
                  result["payload"]=payload
              return result

          out={"schema_version":"1.0.0","campaign_id":"GCL-GHOS-SETTINGS-READBACK-001","recorded_at":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z"),"repositories":{}}
          for repo in repos:
              out["repositories"][repo]={
                  "workflows":contents(repo,".github/workflows"),
                  "codeowners":contents(repo,".github/CODEOWNERS"),
                  "security_policy":contents(repo,"SECURITY.md"),
                  "dependabot":contents(repo,".github/dependabot.yml"),
              }
          out["repository_profile_inventory"]=contents("gcl-standards","fixtures/repository_profiles")
          Path("readback-output/GCL-GHOS-REPOSITORY-SURFACES-001.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({repo:{k:v["status"] for k,v in row.items()} for repo,row in out["repositories"].items()},indent=2,sort_keys=True))
          PY
      - name: Preserve repository surface readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gcl-ghos-repository-surfaces-001
          path: readback-output/GCL-GHOS-REPOSITORY-SURFACES-001.json
          if-no-files-found: error
          retention-days: 14
