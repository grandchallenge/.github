name: GCL-GHOS settings readback 001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/gcl-ghos-settings-readback-001.yml"

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Mint organization readback token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.GCL_COUNCIL_CLERK_APP_ID }}
          private-key: ${{ secrets.GCL_COUNCIL_CLERK_PRIVATE_KEY }}
          owner: grandchallenge
      - name: Read settings and publish branch-only evidence
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ops/gcl-ghos-settings-readback-001
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          BRANCH = os.environ["HEAD_BRANCH"]
          OWNER = "grandchallenge"
          REPOS = [
              ".github",
              "INTELLECT",
              "gcl-standards",
              "MATH-PROGRAMME",
              "MATHFORGE",
              "MATHSOLVE",
              "MATHCERT",
              "MODULUS",
              "GLOSS",
              "QUANTUM-TECHNOLOGIES",
              "lean-action",
              "upload-pages-artifact",
          ]

          def request(method: str, path: str, body: object | None = None) -> tuple[int, object]:
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  API + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "gcl-ghos-settings-readback-001",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                      if not payload:
                          return response.status, None
                      return response.status, json.loads(payload)
              except urllib.error.HTTPError as exc:
                  payload = exc.read()
                  try:
                      parsed = json.loads(payload) if payload else None
                  except json.JSONDecodeError:
                      parsed = payload.decode("utf-8", errors="replace")
                  return exc.code, parsed

          def capture(path: str) -> dict[str, object]:
              status, payload = request("GET", path)
              return {"path": path, "status": status, "payload": payload}

          recorded_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          result: dict[str, object] = {
              "schema_version": "1.0.0",
              "campaign_id": "GCL-GHOS-SETTINGS-READBACK-001",
              "recorded_at": recorded_at,
              "collector": "grandchallenge-council-clerk-app",
              "organization": OWNER,
              "authority": {
                  "constitution_version": "1.1.0",
                  "gi_amend_0001_activation": "8d47ed8930d33253ae476c64dfec7c748185a535",
                  "gcl_ghos_admission": "31211b286a9c4a2874da5559118ef2f026f7de52",
                  "math_programme_pilot_adoption": "9aea6a49153b9c524319544b8f94cf7eeea2e65e",
                  "campaign_issue": "https://github.com/grandchallenge/gcl-standards/issues/22",
              },
              "organization_endpoints": {},
              "repositories": {},
          }

          org_paths = {
              "organization": f"/orgs/{OWNER}",
              "actions_permissions": f"/orgs/{OWNER}/actions/permissions",
              "actions_workflow_permissions": f"/orgs/{OWNER}/actions/permissions/workflow",
              "rulesets": f"/orgs/{OWNER}/rulesets?per_page=100",
          }
          for key, path in org_paths.items():
              result["organization_endpoints"][key] = capture(path)

          repo_paths = {
              "repository": "/repos/{owner}/{repo}",
              "rulesets": "/repos/{owner}/{repo}/rulesets?per_page=100",
              "main_protection": "/repos/{owner}/{repo}/branches/main/protection",
              "actions_permissions": "/repos/{owner}/{repo}/actions/permissions",
              "actions_workflow_permissions": "/repos/{owner}/{repo}/actions/permissions/workflow",
              "vulnerability_alerts": "/repos/{owner}/{repo}/vulnerability-alerts",
              "automated_security_fixes": "/repos/{owner}/{repo}/automated-security-fixes",
              "private_vulnerability_reporting": "/repos/{owner}/{repo}/private-vulnerability-reporting",
              "code_scanning_default_setup": "/repos/{owner}/{repo}/code-scanning/default-setup",
          }
          for repo in REPOS:
              row: dict[str, object] = {}
              for key, template in repo_paths.items():
                  row[key] = capture(template.format(owner=OWNER, repo=repo))
              result["repositories"][repo] = row

          raw = json.dumps(result, indent=2, sort_keys=True) + "\n"
          output_path = "readback-output/GCL-GHOS-SETTINGS-READBACK-001.json"
          put_status, put_payload = request(
              "PUT",
              f"/repos/{OWNER}/.github/contents/{output_path}",
              {
                  "message": "Record temporary GCL-GHOS settings readback",
                  "content": base64.b64encode(raw.encode("utf-8")).decode("ascii"),
                  "branch": BRANCH,
              },
          )
          if put_status not in (200, 201):
              raise SystemExit(f"failed to publish branch-only readback: {put_status} {put_payload}")

          org_status = result["organization_endpoints"]
          repo_rows = result["repositories"]
          lines = [
              "`GCL-GHOS-SETTINGS-READBACK-001` live collection completed.",
              "",
              f"- recorded at: `{recorded_at}`;",
              f"- collector: `grandchallenge-council-clerk-app`;",
              f"- repositories: `{len(REPOS)}`;",
              f"- branch-only raw evidence: `grandchallenge/.github/{BRANCH}:{output_path}`;",
              "- no settings were mutated.",
              "",
              "Organization endpoint status:",
          ]
          for key, value in org_status.items():
              lines.append(f"- `{key}`: HTTP `{value['status']}`")
          lines.extend(["", "Repository endpoint status (`repo`, `rulesets`, `main protection`, `Actions`, `workflow permissions`, `vulnerability alerts`, `automated fixes`, `private reporting`, `CodeQL default setup`):", ""])
          for repo in REPOS:
              row = repo_rows[repo]
              statuses = [
                  row["repository"]["status"],
                  row["rulesets"]["status"],
                  row["main_protection"]["status"],
                  row["actions_permissions"]["status"],
                  row["actions_workflow_permissions"]["status"],
                  row["vulnerability_alerts"]["status"],
                  row["automated_security_fixes"]["status"],
                  row["private_vulnerability_reporting"]["status"],
                  row["code_scanning_default_setup"]["status"],
              ]
              lines.append(f"- `{OWNER}/{repo}`: `{'/'.join(str(value) for value in statuses)}`")
          lines.extend([
              "",
              "HTTP denial or unsupported responses remain `readback_blocked` until disposition; they are not inferred as conformant or nonconformant.",
              "The temporary workflow and raw branch file must be removed and the execution PR closed unmerged after extraction.",
          ])
          comment_status, comment_payload = request(
              "POST",
              f"/repos/{OWNER}/gcl-standards/issues/22/comments",
              {"body": "\n".join(lines)},
          )
          if comment_status != 201:
              raise SystemExit(f"failed to post campaign summary: {comment_status} {comment_payload}")

          print(json.dumps({
              "recorded_at": recorded_at,
              "output_path": output_path,
              "output_commit": put_payload.get("commit", {}).get("sha") if isinstance(put_payload, dict) else None,
              "comment_id": comment_payload.get("id") if isinstance(comment_payload, dict) else None,
              "organization_statuses": {key: value["status"] for key, value in org_status.items()},
              "repository_statuses": {
                  repo: {key: value["status"] for key, value in row.items()}
                  for repo, row in repo_rows.items()
              },
          }, indent=2, sort_keys=True))
          PY
