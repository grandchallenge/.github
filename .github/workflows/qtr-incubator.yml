name: QTR incubator validation

on:
  pull_request:
    paths:
      - "incubation/quantum-technologies-research/**"
      - ".github/records/qtr/QTR-BOOT-001-source-identity.json"
      - ".github/scripts/qtr_source_identity.py"
      - ".github/workflows/qtr-incubator.yml"
  push:
    branches:
      - main
    paths:
      - "incubation/quantum-technologies-research/**"
      - ".github/records/qtr/QTR-BOOT-001-source-identity.json"
      - ".github/scripts/qtr_source_identity.py"
      - ".github/workflows/qtr-incubator.yml"

permissions:
  contents: read

concurrency:
  group: qtr-incubator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Verify migration payload is unchanged
        run: git diff --exit-code 33b87f2f15f3af6c6e3b9e38ed3d0d3ba6244835 -- incubation/quantum-technologies-research
      - name: Validate governed packet
        working-directory: incubation/quantum-technologies-research
        run: python ci/validate.py
      - name: Run reference tests
        working-directory: incubation/quantum-technologies-research
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Replay baseline report
        working-directory: incubation/quantum-technologies-research
        run: |
          python reference/signal_discovery.py --output /tmp/qtr-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("evidence/baseline-report.json").read_text())
          observed = json.loads(Path("/tmp/qtr-baseline.json").read_text())
          if observed != expected:
              raise SystemExit("baseline replay mismatch")
          print(observed["payload_sha256"])
          PY
      - name: Emit source migration identities
        run: |
          python .github/scripts/qtr_source_identity.py \
            --source-commit 33b87f2f15f3af6c6e3b9e38ed3d0d3ba6244835 \
            --output /tmp/qtr-source-identity-ledger.json
      - name: Verify committed source identity ledger
        run: cmp --silent /tmp/qtr-source-identity-ledger.json .github/records/qtr/QTR-BOOT-001-source-identity.json
      - name: Stage and verify exact migration payload
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          ledger_path = Path(".github/records/qtr/QTR-BOOT-001-source-identity.json")
          ledger = json.loads(ledger_path.read_text())
          staging = Path("/tmp/qtr-migration-payload")
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)

          expected_paths = set()
          for entry in ledger["files"]:
              source = Path(entry["path"])
              relative = Path(entry["relative_path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe ledger path: {relative}")
              relative_name = relative.as_posix()
              if relative_name in expected_paths:
                  raise SystemExit(f"duplicate ledger path: {relative_name}")

              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != entry["bytes"]:
                  raise SystemExit(f"byte-count mismatch: {source}")
              if digest != entry["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {source}")

              destination = staging / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              expected_paths.add(relative_name)

          observed_paths = {
              path.relative_to(staging).as_posix()
              for path in staging.rglob("*")
              if path.is_file()
          }
          if observed_paths != expected_paths:
              missing = sorted(expected_paths - observed_paths)
              extra = sorted(observed_paths - expected_paths)
              raise SystemExit(f"staged file-set mismatch: missing={missing}, extra={extra}")

          for entry in ledger["files"]:
              staged = staging / entry["relative_path"]
              data = staged.read_bytes()
              if len(data) != entry["bytes"]:
                  raise SystemExit(f"staged byte-count mismatch: {staged}")
              if hashlib.sha256(data).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"staged SHA-256 mismatch: {staged}")

          print(f"staged and verified {len(observed_paths)} ledger-listed files")
          PY
      - name: Preserve source identity ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtr-source-identity-ledger
          path: /tmp/qtr-source-identity-ledger.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve exact migration payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qtr-migration-payload
          path: /tmp/qtr-migration-payload/
          if-no-files-found: error
          retention-days: 30
