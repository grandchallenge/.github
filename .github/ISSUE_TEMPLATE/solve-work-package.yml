name: Solve work package
description: Open a bounded mathematical work package.
title: "[SOLVE] "
labels: ["type:work-package", "pillar:solve"]
body:
  - type: input
    id: stable_id
    attributes: {label: Stable work-package ID, placeholder: WP-YYYY-NNN}
    validations: {required: true}
  - type: input
    id: upstream
    attributes: {label: Immutable upstream reference}
    validations: {required: true}
  - type: textarea
    id: boundary
    attributes: {label: Claim boundary}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence route}
    validations: {required: true}
  - type: input
    id: state
    attributes: {label: Current state}
    validations: {required: true}
  - type: textarea
    id: promotion
    attributes: {label: Finite promotion condition}
    validations: {required: true}
